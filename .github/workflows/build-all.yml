name: Build & Release All Platforms (macOS, Windows, Linux, Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. macOS (Apple Silicon arm64 .dmg)
  # =========================================================================
  build-macos:
    name: macOS (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build macOS native app and DMG
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh
          cp "L'antre du caddrillage.dmg" "L-antre-du-caddrillage.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: L-antre-du-caddrillage.dmg

  # =========================================================================
  # 2. Windows (.exe)
  # =========================================================================
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npx electron-builder --win --publish never
          Get-ChildItem -Path dist/*.exe | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            if ($_.Name -like "*Setup*") {
              Copy-Item $_.FullName "dist/L-antre-du-caddrillage-Setup.exe"
            } else {
              Copy-Item $_.FullName "dist/L-antre-du-caddrillage.exe"
            }
          }
          if (-not (Test-Path "dist/L-antre-du-caddrillage.exe")) {
            Copy-Item (Get-ChildItem -Path dist/*.exe | Select-Object -First 1).FullName "dist/L-antre-du-caddrillage.exe"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/L-antre-du-caddrillage*.exe

  # =========================================================================
  # 3. Linux (.AppImage)
  # =========================================================================
  build-linux:
    name: Linux (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (libfuse2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Install dependencies & Build Linux AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npx electron-builder --linux AppImage --publish never
          find dist -name "*.AppImage" -exec cp {} dist/L-antre-du-caddrillage.AppImage \;

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/L-antre-du-caddrillage.AppImage

  # =========================================================================
  # 4. Android (.apk)
  # =========================================================================
  build-android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html style.css app.js www/
          cp -R libs www/
          cp *.jpg *.jpeg *.png *.webp *.svg *.gif *.ico www/ 2>/dev/null || true
          cp *.pdf www/ 2>/dev/null || true
          cp seed_writings.json www/ 2>/dev/null || true

      - name: Install dependencies and setup Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk L-antre-du-caddrillage.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: L-antre-du-caddrillage.apk

  # =========================================================================
  # 5. Publication automatique GitHub Release
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    if: always()
    needs: [build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
        continue-on-error: true

      - name: Flatten release assets
        run: |
          mkdir -p final-assets
          find release-assets/ -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.apk" \) -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "L'antre du caddrillage — Versions Officielles (macOS, Windows, Linux, Android)"
          body: |
            ## L'antre du caddrillage — Applications Officielles

            Bienvenue sur la version autonome de **L'antre du caddrillage**.

            ### Téléchargements directs :
            - 🍎 **macOS (Apple Silicon & Intel)** : [`L-antre-du-caddrillage.dmg`](https://github.com/${{ github.repository }}/releases/latest/download/L-antre-du-caddrillage.dmg)
            - 🪟 **Windows (10 & 11)** : [`L-antre-du-caddrillage.exe`](https://github.com/${{ github.repository }}/releases/latest/download/L-antre-du-caddrillage.exe)
            - 🐧 **Linux** : [`L-antre-du-caddrillage.AppImage`](https://github.com/${{ github.repository }}/releases/latest/download/L-antre-du-caddrillage.AppImage)
            - 🤖 **Android (Smartphones & Tablettes)** : [`L-antre-du-caddrillage.apk`](https://github.com/${{ github.repository }}/releases/latest/download/L-antre-du-caddrillage.apk)

            ### Fonctionnalités intégrées :
            - 100% Hors-ligne : Tous les écrits, poèmes et la liseuse PDF sont embarqués.
            - Synchronisation automatique avec Supabase dès que la connexion revient.
            - Les 11 ambiances et thèmes complets (Halloween 2026 avec spectres, Backroom, Galaxie...).
            - Exportateur ZIP intégré.
          files: |
            final-assets/*
          prerelease: false
          draft: false
