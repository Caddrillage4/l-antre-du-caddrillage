name: Build & Release All Platforms (macOS, Windows, Linux, Android)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. macOS (Apple Silicon arm64 .dmg)
  # =========================================================================
  build-macos:
    name: macOS (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build macOS native app and DMG
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh
          cp "L'antre du caddrillage.dmg" "L-antre-du-caddrillage.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: L-antre-du-caddrillage.dmg

  # =========================================================================
  # 2. Windows (.exe)
  # =========================================================================
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Windows installer
        shell: pwsh
        run: |
          npm install
          npx electron-builder --win
          Get-ChildItem -Path dist/*.exe | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            if ($_.Name -like "*Setup*") {
              Copy-Item $_.FullName "dist/L-antre-du-caddrillage-Setup.exe"
            } else {
              Copy-Item $_.FullName "dist/L-antre-du-caddrillage.exe"
            }
          }
          if (-not (Test-Path "dist/L-antre-du-caddrillage.exe")) {
            Copy-Item (Get-ChildItem -Path dist/*.exe | Select-Object -First 1).FullName "dist/L-antre-du-caddrillage.exe"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/L-antre-du-caddrillage*.exe

  # =========================================================================
  # 3. Linux (.AppImage)
  # =========================================================================
  build-linux:
    name: Linux (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Linux AppImage
        run: |
          npm install
          npx electron-builder --linux AppImage
          find dist -name "*.AppImage" -exec cp {} dist/L-antre-du-caddrillage.AppImage \;

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/L-antre-du-caddrillage.AppImage

  # =========================================================================
  # 4. Android (.apk)
  # =========================================================================
  build-android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android project
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap copy android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk L-antre-du-caddrillage.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: L-antre-du-caddrillage.apk

  # =========================================================================
  # 5. Publication automatique GitHub Release
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-assets/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release-assets/

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: List downloaded release assets
        run: ls -la release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "L'antre du caddrillage — Versions Officielles (macOS, Windows, Linux, Android)"
          body: |
            ## L'antre du caddrillage — Applications Officielles

            Bienvenue sur la version autonome de **L'antre du caddrillage**.

            ### Téléchargements directs :
            - 🍎 **macOS (Apple Silicon & Intel)** : [`L-antre-du-caddrillage.dmg`](https://github.com/${{ github.repository }}/releases/latest/download/L-antre-du-caddrillage.dmg)
            - 🪟 **Windows (10 & 11)** : [`L-antre-du-caddrillage.exe`](https://github.com/${{ github.repository }}/releases/latest/download/L-antre-du-caddrillage.exe)
            - 🐧 **Linux** : [`L-antre-du-caddrillage.AppImage`](https://github.com/${{ github.repository }}/releases/latest/download/L-antre-du-caddrillage.AppImage)
            - 🤖 **Android (Smartphones & Tablettes)** : [`L-antre-du-caddrillage.apk`](https://github.com/${{ github.repository }}/releases/latest/download/L-antre-du-caddrillage.apk)

            ### Fonctionnalités intégrées :
            - 100% Hors-ligne : Tous les écrits, poèmes et la liseuse PDF sont embarqués.
            - Synchronisation automatique avec Supabase dès que la connexion revient.
            - Les 11 ambiances et thèmes complets (Halloween 2026 avec spectres, Backroom, Galaxie...).
            - Exportateur ZIP intégré.
          files: |
            release-assets/*
          prerelease: false
          draft: false
